<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Leak sheet — what you keep getting wrong at chess, across your whole game history." />
    <!-- Installed to an Android home screen the app runs without browser chrome, so the
         status bar has to carry the masthead's bone rather than a default white. The
         boot script below swaps it for the dark page colour in the dark theme. -->
    <meta name="theme-color" content="#e8e2d4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Leak Sheet — Chess Analyzer</title>
    <!-- Theme, typefaces and text size, applied before the first paint so a dark sheet
         never flashes bone-white while the bundle loads. The choices and the CSS they
         come to are written by web/src/appearance.ts; this only applies what it stored,
         and resolves "follow the system" — live, so the sheet turns with the device. -->
    <script>
      (function () {
        var root = document.documentElement;
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem('chesscoach.appearance') || '{}') || {};
        } catch (e) {}
        var css = saved.css || {};
        for (var name in css) {
          if (/^--[a-z-]+$/.test(name)) root.style.setProperty(name, String(css[name]));
        }
        root.setAttribute('data-theme-choice', saved.theme || 'system');
        var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        function apply() {
          var choice = root.getAttribute('data-theme-choice');
          var dark = choice === 'dark' || (choice !== 'light' && !!media && media.matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#15140f' : '#e8e2d4');
        }
        apply();
        if (media && media.addEventListener) media.addEventListener('change', apply);
        window.__leaksheetApplyTheme = apply;
      })();
    </script>
    <!-- Self-hosted rather than fetched from Google: an exported snapshot has to
         render with no network, and this design leans on its typefaces. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- The typefaces you can switch to in Settings. Declarations only: a browser
         fetches a font file when something first uses it, so these cost nothing until
         chosen. Exports drop this link and keep the designed faces. -->
    <link rel="stylesheet" href="/fonts/extra/extra.css" data-fonts="extra" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
